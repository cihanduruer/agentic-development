name: PR validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number whose exact head will be validated
        required: true
        type: string
      head_sha:
        description: Full expected pull request head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify manually requested pull request head
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Manual validation must run from main."
          }
          if ($env:EXPECTED_HEAD_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "head_sha must be a full 40-character lowercase commit SHA."
          }
          if ($env:PR_NUMBER -notmatch '^[1-9][0-9]*$') {
            throw "pull_request_number must be a positive integer."
          }

          $pullRequest = gh api "repos/${{ github.repository }}/pulls/$env:PR_NUMBER" | ConvertFrom-Json
          if ($pullRequest.base.repo.full_name -ne "${{ github.repository }}" -or $pullRequest.base.ref -ne "main") {
            throw "Pull request #$env:PR_NUMBER does not target ${{ github.repository }}:main."
          }
          if ($pullRequest.head.repo.full_name -ne "${{ github.repository }}") {
            throw "Pull request #$env:PR_NUMBER comes from another repository."
          }
          if ($pullRequest.state -ne "open") {
            throw "Pull request #$env:PR_NUMBER is not open."
          }
          if ($pullRequest.head.sha -ne $env:EXPECTED_HEAD_SHA) {
            throw "Pull request #$env:PR_NUMBER head is '$($pullRequest.head.sha)', not '$env:EXPECTED_HEAD_SHA'."
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out target commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pull_request_number || github.event.pull_request.number }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $checkedOutSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOutSha -ne $env:TARGET_SHA) {
            throw "Checked out commit '$checkedOutSha' does not match target '$env:TARGET_SHA'."
          }

          if ("${{ github.event_name }}" -in @('pull_request', 'workflow_dispatch')) {
            $pullRequest = gh api "repos/${{ github.repository }}/pulls/$env:PR_NUMBER" | ConvertFrom-Json
            if ($pullRequest.state -ne "open" -or $pullRequest.head.sha -ne $env:TARGET_SHA) {
              throw "Pull request #$env:PR_NUMBER no longer has target head '$env:TARGET_SHA'."
            }
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore
        run: dotnet restore --locked-mode
      - name: Test agentic intake script
        if: github.event_name != 'workflow_dispatch' || hashFiles('scripts/Test-Start-AgenticWork.ps1') != ''
        shell: pwsh
        run: ./scripts/Test-Start-AgenticWork.ps1
      - name: Test QA evidence script
        shell: pwsh
        run: ./scripts/Test-New-QaEvidence.ps1
      - name: Test web deployment configuration
        shell: pwsh
        run: ./scripts/Test-Set-WebApiConfiguration.ps1
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --logger trx --results-directory TestResults
      - name: Routing evaluation evidence
        run: >-
          dotnet test tests/UnitTests/AgenticHotelBooking.UnitTests.csproj
          --no-build
          --filter "FullyQualifiedName~RoutingEvaluationTests|FullyQualifiedName~KnowledgeDocumentChunkerTests"
          --logger "trx;LogFileName=grounding-evaluation.trx"
          --results-directory EvaluationResults
      - name: Vulnerability scan
        shell: pwsh
        run: |
          dotnet list package --vulnerable --include-transitive --format json |
            Set-Content vulnerabilities.json
          $report = Get-Content vulnerabilities.json -Raw | ConvertFrom-Json
          $findings = @(
            $report.projects.frameworks.topLevelPackages |
              Where-Object { $_.vulnerabilities.Count -gt 0 }
            $report.projects.frameworks.transitivePackages |
              Where-Object { $_.vulnerabilities.Count -gt 0 }
          )
          if ($findings.Count -gt 0) {
            $findings | ConvertTo-Json -Depth 10
            throw "NuGet vulnerability scan found $($findings.Count) vulnerable package entries."
          }
      - name: Build Bicep
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file infra/main.bicep
      - name: Write validation provenance
        shell: pwsh
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          New-Item -ItemType Directory -Path ValidationEvidence -Force | Out-Null
          @{
            workflow = 'pr-validation.yml'
            event = '${{ github.event_name }}'
            targetSha = $env:TARGET_SHA
            checkedOutSha = (git rev-parse HEAD).Trim()
            runId = '${{ github.run_id }}'
          } | ConvertTo-Json | Set-Content ValidationEvidence/validation.json
      - name: Upload validation provenance
        uses: actions/upload-artifact@v4
        with:
          name: pr-validation-evidence-${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: ValidationEvidence
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-evaluation-evidence
          path: EvaluationResults
