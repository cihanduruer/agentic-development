name: Agentic intake

on:
  workflow_dispatch:
    inputs:
      work_item_id:
        description: Azure Boards work item ID to process (for targeted recovery)
        required: true
        type: string
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: agentic-intake
  cancel-in-progress: false

jobs:
  dispatch:
    environment: development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Test intake response handling
        shell: pwsh
        run: ./scripts/Test-Start-AgenticWork.ps1
      - name: Start Copilot work for eligible hotel items
        shell: pwsh
        env:
          TARGET_WORK_ITEM_ID: ${{ inputs.work_item_id }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
        run: |
          $parameters = @{}
          if ($env:TARGET_WORK_ITEM_ID) {
            $parameters.WorkItemId = [int]$env:TARGET_WORK_ITEM_ID
          }
          ./scripts/Start-AgenticWork.ps1 @parameters
