name: Microsoft grounded evaluation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  evaluate:
    environment: development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Microsoft evaluation SDK
        run: pip install azure-ai-evaluation==1.18.7 azure-identity==1.25.1
      - name: Run groundedness evaluation
        env:
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_AI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: gpt-4.1-mini
        run: python evaluation/run_groundedness.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: microsoft-grounded-evaluation-${{ github.sha }}
          path: EvaluationResults
