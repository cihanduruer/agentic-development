name: Deploy development

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'infra/**'
      - '.github/workflows/deploy-development.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy infrastructure
        id: infrastructure
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: agentic-hotelbookingdev
          template: infra/resource-group.bicep
          parameters: environment=dev sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }} operationsApiAudience=${{ vars.OPERATIONS_API_AUDIENCE }}
          failOnStdErr: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish API
        run: dotnet publish src/Api/AgenticHotelBooking.Api.csproj -c Release -o artifacts/api
      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: artifacts/api
      - name: Publish web
        run: dotnet publish src/Web/AgenticHotelBooking.Web.csproj -c Release -o artifacts/web
      - name: Configure web API endpoint
        shell: pwsh
        run: |
          @{ ApiBaseUrl = '${{ steps.infrastructure.outputs.apiUrl }}/' } |
            ConvertTo-Json |
            Set-Content artifacts/web/wwwroot/appsettings.json
      - name: Deploy web
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: artifacts/web/wwwroot
          output_location: ''
          skip_app_build: true
