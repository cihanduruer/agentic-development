name: Hotel code review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: hotel-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  eligibility:
    name: Review eligibility
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - name: Identify hotel change
        id: check
        uses: actions/github-script@v8
        with:
          script: |
            const pull = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100
            });
            const hotelPaths = [
              /^src\//,
              /^tests\//,
              /^infra\//,
              /^scripts\//,
              /^\.github\/agents\/hotel-/,
              /^\.github\/workflows\//
            ];
            const eligible = !pull.draft
              && pull.base.ref === 'main'
              && files.some(file => hotelPaths.some(pattern => pattern.test(file.filename)));
            core.info(eligible
              ? 'Eligible hotel implementation or delivery change.'
              : 'Not eligible: draft, non-main target, or documentation-only change.');
            core.setOutput('eligible', eligible.toString());

  review:
    name: Copilot findings gate
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request Copilot review
        id: request-review
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.COPILOT_AGENT_TOKEN }}
          script: |
            const existingReviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            core.setOutput(
              'existing_review_ids',
              existingReviews.map(review => review.id).join(','));
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: ['copilot-pull-request-reviewer[bot]']
            });
            core.info('Requested a Copilot review for the current pull request head.');

      - name: Wait for current-head review and evaluate findings
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull = context.payload.pull_request;
            const reviewer = 'copilot-pull-request-reviewer[bot]';
            const reviewerGraphql = 'copilot-pull-request-reviewer';
            const isCopilotReviewer = login =>
              login === reviewer || login === reviewerGraphql;
            const reviewerIdentityRegressions = [
              [reviewer, true],
              [reviewerGraphql, true],
              ['unrelated-bot[bot]', false]
            ];
            for (const [login, expected] of reviewerIdentityRegressions) {
              if (isCopilotReviewer(login) !== expected) {
                core.setFailed(`Reviewer identity regression for '${login}'.`);
                return;
              }
            }
            const existingReviewIds = new Set(
              '${{ steps.request-review.outputs.existing_review_ids }}'
                .split(',')
                .filter(Boolean)
                .map(Number));
            const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
            const isNewCurrentHeadReview = review =>
              isCopilotReviewer(review.user?.login)
              && review.commit_id === pull.head.sha
              && !existingReviewIds.has(review.id);
            const freshnessRegressions = [
              [{ id: 1, user: { login: reviewer }, commit_id: pull.head.sha }, new Set([1]), false],
              [{ id: 2, user: { login: reviewer }, commit_id: pull.head.sha }, new Set([1]), true],
              [{ id: 2, user: { login: reviewer }, commit_id: '0'.repeat(40) }, new Set([1]), false]
            ];
            for (const [review, priorIds, expected] of freshnessRegressions) {
              const originalIds = new Set(existingReviewIds);
              existingReviewIds.clear();
              for (const id of priorIds) existingReviewIds.add(id);
              if (isNewCurrentHeadReview(review) !== expected) {
                core.setFailed(`Review freshness regression for review ${review.id}.`);
                return;
              }
              existingReviewIds.clear();
              for (const id of originalIds) existingReviewIds.add(id);
            }

            let currentReview;
            for (let attempt = 1; attempt <= 36; attempt++) {
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pull.number,
                per_page: 100
              });
              currentReview = reviews
                .filter(isNewCurrentHeadReview)
                .sort((left, right) => new Date(right.submitted_at) - new Date(left.submitted_at))[0];
              if (currentReview) {
                break;
              }
              core.info(`Current-head Copilot review not complete (attempt ${attempt}/36).`);
              await sleep(10000);
            }

            if (!currentReview) {
              core.setFailed('Copilot did not produce a review for the current head within six minutes.');
              return;
            }

            const result = await github.graphql(
              `query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100) {
                      pageInfo { hasNextPage }
                      nodes {
                        isResolved
                        comments(first: 20) {
                          nodes {
                            author { login }
                            body
                            url
                          }
                        }
                      }
                    }
                  }
                }
              }`,
              { owner, repo, number: pull.number }
            );

            const connection = result.repository.pullRequest.reviewThreads;
            if (connection.pageInfo.hasNextPage) {
              core.setFailed('More than 100 review threads exist; refusing to pass an incomplete evaluation.');
              return;
            }

            const severity = body => {
              const normalized = body.replace(/[*_`#<>"]/g, ' ');
              if (/\bseverity\s*:?\s*high\b/i.test(normalized)
                  || /\bhigh\s+severity\b/i.test(normalized)
                  || /^\s*high\s*$/im.test(normalized)) {
                return 'high';
              }
              if (/\bseverity\s*:?\s*medium\b/i.test(normalized)
                  || /\bmedium\s+severity\b/i.test(normalized)
                  || /^\s*medium\s*$/im.test(normalized)) {
                return 'medium';
              }
              if (/\bseverity\s*:?\s*low\b/i.test(normalized)
                  || /\blow\s+severity\b/i.test(normalized)
                  || /^\s*low\s*$/im.test(normalized)) {
                return 'low';
              }
              return 'unknown';
            };
            const findingSeveritiesByUrl = body => {
              const severities = new Map();
              for (const line of body.split(/\r?\n/)) {
                const badges = new Set([...line.matchAll(/\balt=["']?(high|medium|low)\s+severity["']?/gi)]
                  .map(match => match[1].toLowerCase()));
                const links = [...line.matchAll(/\]\((https:\/\/github\.com\/[^)\s]+#discussion_r\d+)\)/gi)];
                if (badges.size > 0 && links.length === 1) {
                  const url = links[0][1];
                  const level = badges.size === 1 ? [...badges][0] : 'unknown';
                  severities.set(url, severities.has(url) && severities.get(url) !== level
                    ? 'unknown'
                    : level);
                }
              }
              return severities;
            };
            const severityForComment = (comment, findingSeverities) => {
              const commentSeverity = severity(comment.body);
              return commentSeverity === 'unknown'
                ? findingSeverities.get(comment.url) || commentSeverity
                : commentSeverity;
            };
            const severityRegressions = [
              ['<img alt="High severity">', 'high'],
              ['Severity: Medium', 'medium'],
              ['low severity', 'low'],
              ['Changes recommended', 'unknown']
            ];
            for (const [sample, expected] of severityRegressions) {
              if (severity(sample) !== expected) {
                core.setFailed(`Severity parser regression for '${sample}'.`);
                return;
              }
            }
            const findingSeverityRegressions = findingSeveritiesByUrl([
              '- <img alt="Medium severity"> [first finding](https://github.com/owner/repo/pull/1#discussion_r123)',
              '- <img alt="Low severity"> [second finding](https://github.com/owner/repo/pull/1#discussion_r456)',
              '- <img alt="High severity"> [conflicting finding](https://github.com/owner/repo/pull/1#discussion_r321)',
              '- <img alt="Low severity"> [conflicting finding](https://github.com/owner/repo/pull/1#discussion_r321)',
              '- <img alt="Medium severity"><img alt="Low severity"> [mixed badges](https://github.com/owner/repo/pull/1#discussion_r654)'
            ].join('\n'));
            const commentSeverityRegressions = [
              [{ body: 'Mixed badges on one entry', url: 'https://github.com/owner/repo/pull/1#discussion_r654' }, 'unknown'],
              [{ body: 'Conflicting summary entries', url: 'https://github.com/owner/repo/pull/1#discussion_r321' }, 'unknown'],
              [{ body: 'Finding without an inline severity', url: 'https://github.com/owner/repo/pull/1#discussion_r123' }, 'medium'],
              [{ body: 'High severity', url: 'https://github.com/owner/repo/pull/1#discussion_r123' }, 'high'],
              [{ body: 'Finding without a matching summary badge', url: 'https://github.com/owner/repo/pull/1#discussion_r789' }, 'unknown']
            ];
            if (findingSeverityRegressions.get('https://github.com/owner/repo/pull/1#discussion_r123') !== 'medium'
                || findingSeverityRegressions.get('https://github.com/owner/repo/pull/1#discussion_r456') !== 'low'
                || commentSeverityRegressions.some(([comment, expected]) =>
                  severityForComment(comment, findingSeverityRegressions) !== expected)) {
              core.setFailed('Review-summary finding severity regression.');
              return;
            }

            const reportsFindings = body => {
              const findings = body.match(/\bfindings?\s*:\s*(\d+)/i);
              const open = body.match(/<summary>\s*<strong>\s*open\s*\((\d+)\)/i);
              if (findings && Number(findings[1]) === 0
                  && (!open || Number(open[1]) === 0)) {
                return false;
              }
              const recommendsChanges = /\bchanges?\s+recommended\b/i.test(body)
                && !/\bno changes?\s+recommended\b/i.test(body);
              return (findings && Number(findings[1]) > 0)
                || (open && Number(open[1]) > 0)
                || recommendsChanges;
            };
            const activeReviewBody = body => {
              const sections = body.split(/<!--\s*ccr-overview-v2\s*-->/i);
              const latest = sections.length > 1 ? sections[sections.length - 1] : body;
              return latest.replace(
                /<details>\s*<summary><strong>\s*(?:\d+\s+)?resolved since last review[\s\S]*?<\/details>/gi,
                '');
            };
            const badgeSeverity = body => {
              const levels = new Set([...body.matchAll(/\balt=["']?(high|medium|low)\s+severity["']?/gi)]
                .map(match => match[1].toLowerCase()));
              return ['high', 'medium', 'low'].find(level => levels.has(level)) || null;
            };
            const findingsRegressions = [
              ['Findings: 0', false],
              ['Findings: 0\n<summary><strong>Open (0)</strong></summary>', false],
              ['Findings: 1', true],
              ['<summary><strong>Open (2)</strong></summary>', true],
              ['Changes recommended', true],
              ['No changes recommended', false]
            ];
            for (const [sample, expected] of findingsRegressions) {
              if (reportsFindings(sample) !== expected) {
                core.setFailed(`Review-body findings regression for '${sample}'.`);
                return;
              }
            }
            const reviewHistoryRegression = [
              '**Findings:** None',
              '<details><summary><strong>Resolved since last review (2)</strong></summary>',
              '<img alt="High severity"> fixed finding',
              '</details>',
              '<details><summary><strong>Previously missed (1)</strong></summary>',
              '<img alt="Medium severity"> active finding',
              '</details>'
            ].join('\n');
            if (severity(activeReviewBody(reviewHistoryRegression)) !== 'medium'
                || reportsFindings(activeReviewBody(reviewHistoryRegression))
                || severity(activeReviewBody([
                  '<details>',
                  '<summary><strong>1 resolved since last review</strong></summary>',
                  '<img alt="High severity"> fixed finding',
                  '</details>',
                  '<img alt="Medium severity"> active finding'
                ].join('\n'))) !== 'medium'
                || badgeSeverity(activeReviewBody([
                  '<!-- ccr-overview-v2 -->',
                  '### Changes recommended',
                  '<img alt="High severity"> superseded open finding',
                  '<!-- ccr-overview-v2 -->',
                  '<img alt="Medium severity"> Title that mentions high severity text'
                ].join('\n'))) !== 'medium') {
              core.setFailed('Resolved review-history regression.');
              return;
            }

            const reviewBody = activeReviewBody(currentReview.body || '');
            const reviewBodySeverity = badgeSeverity(reviewBody) || severity(reviewBody);
            const findingSeverities = findingSeveritiesByUrl(reviewBody);
            const reviewBodyReportsFindings = reportsFindings(reviewBody);
            const unresolved = connection.nodes
              .filter(thread => !thread.isResolved)
              .flatMap(thread => thread.comments.nodes)
              .filter(comment => isCopilotReviewer(comment.author?.login))
              .map(comment => ({
                ...comment,
                severity: severityForComment(comment, findingSeverities)
              }));
            const blocking = unresolved.filter(comment =>
              comment.severity === 'high' || comment.severity === 'unknown');
            if (reviewBodySeverity === 'high'
                || (reviewBodyReportsFindings && reviewBodySeverity === 'unknown')) {
              blocking.unshift({
                url: currentReview.html_url || pull.html_url,
                severity: reviewBodySeverity,
                body: reviewBody
              });
            }

            const label = 'development-required';
            if (blocking.length > 0) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: label,
                  color: 'B60205',
                  description: 'Blocking review or QA evidence must return to development.'
                });
              }
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull.number,
                labels: [label]
              });
              const links = blocking.map(comment => `- ${comment.url}`).join('\n');
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull.number,
                body: `The automated review gate found unresolved blocking Copilot findings. Resolve the threads and push or re-request review before QA.\n\n${links}`
              });
              core.setFailed(`${blocking.length} unresolved high or unclassified Copilot finding(s) require development.`);
              return;
            }

            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: pull.number,
                name: label
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.info(`${unresolved.length} unresolved medium/low finding(s); no blocking high-confidence finding remains.`);

  not-eligible:
    name: Copilot review not required
    needs: eligibility
    if: needs.eligibility.outputs.eligible != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Copilot review is not required for this pull request."
