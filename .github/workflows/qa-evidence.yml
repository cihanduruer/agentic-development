name: QA evidence

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open same-repository pull request number
        required: true
        type: string
      head_sha:
        description: Exact current 40-character pull request head SHA
        required: true
        type: string
  workflow_run:
    workflows: [Hotel code review, PR validation]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: qa-evidence-${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  qa:
    name: Independent QA evidence gate
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.name == 'Hotel code review'
        && github.event.workflow_run.event == 'pull_request_target'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event.workflow_run.name == 'PR validation'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve source context
        id: context
        uses: actions/github-script@v8
        with:
          script: |
            const manual = context.eventName === 'workflow_dispatch';
            const run = context.payload.workflow_run;
            const baseRepository = `${context.repo.owner}/${context.repo.repo}`;
            const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
            const apiDeadline = Date.now() + 15 * 60 * 1000;
            const callGitHub = async request => {
              for (let rateLimitRetry = 0; ; rateLimitRetry++) {
                try {
                  return await request();
                } catch (error) {
                  const headers = error.response?.headers || {};
                  const rateLimited = error.status === 429
                    || (error.status === 403
                      && (headers['x-ratelimit-remaining'] === '0'
                        || headers['retry-after'] !== undefined
                        || /secondary rate limit/i.test(error.message || '')));
                  if (!rateLimited) {
                    throw error;
                  }
                  const retryAfter = headers['retry-after'] === undefined ? NaN : Number(headers['retry-after']);
                  const reset = Number(headers['x-ratelimit-reset']);
                  let waitMilliseconds = 60000;
                  if (Number.isFinite(retryAfter) && retryAfter >= 0) {
                    waitMilliseconds = retryAfter * 1000;
                  } else if (headers['x-ratelimit-remaining'] === '0' && Number.isFinite(reset)) {
                    waitMilliseconds = reset * 1000 - Date.now() + 1000;
                  }
                  waitMilliseconds = Math.max(waitMilliseconds, 1000);
                  const resumeAt = new Date(Date.now() + waitMilliseconds).toISOString();
                  if (rateLimitRetry >= 5 || Date.now() + waitMilliseconds > apiDeadline) {
                    throw new Error(
                      `GitHub API rate limit (HTTP ${error.status}) persists until ${resumeAt}, beyond the bounded QA wait. `
                      + 'Rerun QA evidence after that time; credentials and permissions were not changed.');
                  }
                  core.warning(`GitHub API rate limit (HTTP ${error.status}); waiting until ${resumeAt} before retrying.`);
                  await sleep(waitMilliseconds);
                }
              }
            };
            let pull;
            let sourceRepository = baseRepository;
            let sourceSha;
            if (manual) {
              if (context.ref !== 'refs/heads/main') {
                core.setFailed('Manual QA fallback must run from main.');
                return;
              }
              const number = Number(context.payload.inputs.pull_request_number);
              const requestedSha = context.payload.inputs.head_sha;
              if (!Number.isInteger(number) || number < 1 || !/^[0-9a-f]{40}$/.test(requestedSha)) {
                core.setFailed('Manual QA requires a valid PR number and exact lowercase 40-character head SHA.');
                return;
              }
              pull = (await callGitHub(() => github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number
              }))).data;
              const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
              if (pull.state !== 'open'
                  || pull.base.ref !== 'main'
                  || pull.head.repo?.full_name !== expectedRepository
                  || pull.head.sha !== requestedSha) {
                core.setFailed('Manual QA target must be the current head of an open same-repository PR to main.');
                return;
              }
              sourceRepository = pull.head.repo.full_name;
              sourceSha = requestedSha;
            } else {
              if (run.pull_requests?.length) {
                pull = (await callGitHub(() => github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: run.pull_requests[0].number
                }))).data;
              } else {
                const pulls = await callGitHub(() => github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: run.head_sha
                }));
                const candidates = pulls.data.filter(candidate =>
                  candidate.base.repo.full_name === baseRepository
                  && candidate.base.ref === 'main');
                pull = run.name === 'Hotel code review'
                  ? candidates.find(candidate => candidate.head.sha === run.head_sha)
                  : candidates
                      .filter(candidate => candidate.merged_at)
                      .sort((left, right) => new Date(right.merged_at) - new Date(left.merged_at))[0];
              }
              sourceSha = run.head_sha;
              sourceRepository = run.head_repository.full_name;
            }
            if (!pull) {
              core.setFailed('No pull request is associated with the validated commit.');
              return;
            }
            if (pull.base.repo.full_name !== baseRepository || pull.base.ref !== 'main') {
              core.setFailed('QA evidence requires a pull request to this repository main branch.');
              return;
            }

            if (!manual && run.name === 'Hotel code review') {
              sourceRepository = pull.head.repo?.full_name;
              sourceSha = pull.head.sha;
              if (!sourceRepository
                  || !/^[0-9a-f]{40}$/.test(sourceSha)
                  || sourceSha !== run.head_sha) {
                core.setFailed('The triggering review run does not identify the pull request head.');
                return;
              }
              const currentPull = (await callGitHub(() => github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number
              }))).data;
              if (currentPull.state !== 'open'
                  || currentPull.head.sha !== sourceSha
                  || currentPull.head.repo?.full_name !== sourceRepository) {
                core.setFailed('The pull request head changed after the reviewed workflow run.');
                return;
              }
              pull = currentPull;
            }

            if (manual || run.name === 'Hotel code review') {
              const artifactName = `pr-validation-evidence-${sourceSha}`;
              const rejectedRuns = new Set();
              let validation;
              for (let attempt = 1; attempt <= 60 && !validation; attempt++) {
                const listing = (await callGitHub(() => github.rest.actions.listArtifactsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: artifactName,
                  per_page: 100
                }))).data;
                if (listing.total_count > listing.artifacts.length) {
                  core.setFailed(`Too many artifacts are named ${artifactName}; refusing an unbounded provenance scan.`);
                  return;
                }
                for (const artifact of listing.artifacts) {
                  const runId = artifact.workflow_run?.id;
                  if (artifact.name !== artifactName
                      || artifact.expired
                      || (artifact.expires_at && Date.parse(artifact.expires_at) <= Date.now())
                      || !Number.isInteger(runId)
                      || rejectedRuns.has(runId)) {
                    continue;
                  }
                  const candidate = (await callGitHub(() => github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: runId
                  }))).data;
                  if (candidate.id !== runId
                      || candidate.path !== '.github/workflows/pr-validation.yml'
                      || candidate.event !== 'workflow_dispatch'
                      || candidate.head_branch !== 'main'
                      || candidate.repository?.full_name !== baseRepository
                      || candidate.head_repository?.full_name !== baseRepository) {
                    rejectedRuns.add(runId);
                    continue;
                  }
                  if (candidate.status !== 'completed' || candidate.conclusion !== 'success') {
                    continue;
                  }
                  const attached = (await callGitHub(() => github.rest.actions.listWorkflowRunArtifacts({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: runId,
                    name: artifactName,
                    per_page: 100
                  }))).data.artifacts;
                  if (attached.some(item =>
                    item.id === artifact.id
                    && item.name === artifactName
                    && !item.expired)) {
                    validation = candidate;
                    break;
                  }
                }
                if (!validation && attempt < 60) {
                  if (Date.now() + 10000 > apiDeadline) {
                    break;
                  }
                  core.info(`PR validation evidence is not complete (attempt ${attempt}/60).`);
                  await sleep(10000);
                }
              }
              if (!validation) {
                core.setFailed('No successful trusted PR validation evidence exists for this commit.');
                return;
              }
            }

            const files = await callGitHub(() => github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100
            }));
            core.setOutput('number', pull.number.toString());
            core.setOutput('title', pull.title);
            core.setOutput('head-sha', sourceSha);
            core.setOutput('source-repository', sourceRepository);
            core.setOutput('trusted-knowledge-revision', pull.base.sha);
            core.setOutput('body-base64', Buffer.from(pull.body || '', 'utf8').toString('base64'));
            core.setOutput(
              'files-base64',
              Buffer.from(files.map(file => file.filename).join('\n'), 'utf8').toString('base64'));

      - name: Check out trusted QA policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.context.outputs.source-repository }}
          ref: ${{ steps.context.outputs.head-sha }}
          path: source
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: source
        run: dotnet restore --locked-mode

      - name: Build
        working-directory: source
        run: dotnet build --no-restore

      - name: Run independent QA tests
        working-directory: source
        run: >-
          dotnet test AgenticHotelBooking.slnx
          --configuration Debug
          --no-build
          --filter FullyQualifiedName!~AgenticHotelBooking.IntegrationTests.SqlManagedIdentityBootstrapperSqlServerTests.
          --logger trx
          --results-directory TestResults

      - name: Build Bicep
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file source/infra/main.bicep

      - name: Write pull request evidence
        shell: pwsh
        env:
          BODY_BASE64: ${{ steps.context.outputs.body-base64 }}
          FILES_BASE64: ${{ steps.context.outputs.files-base64 }}
        run: |
          New-Item -ItemType Directory -Path QaEvidence -Force | Out-Null
          . ./trusted/scripts/PullRequestClassification.ps1
          Write-Base64Utf8File -Base64 $env:BODY_BASE64 -Path 'QaEvidence/pr-body.md'
          Write-Base64Utf8File -Base64 $env:FILES_BASE64 -Path 'QaEvidence/changed-files.txt'

      - name: Evaluate QA evidence
        id: evidence
        shell: pwsh
        env:
          PR_NUMBER: ${{ steps.context.outputs.number }}
          PR_TITLE: ${{ steps.context.outputs.title }}
          HEAD_SHA: ${{ steps.context.outputs.head-sha }}
          TRUSTED_KNOWLEDGE_REVISION: ${{ steps.context.outputs.trusted-knowledge-revision }}
        run: |
          ./trusted/scripts/New-QaEvidence.ps1 `
            -PullRequestNumber $env:PR_NUMBER `
            -PullRequestTitle $env:PR_TITLE `
            -PullRequestBodyPath QaEvidence/pr-body.md `
            -HeadSha $env:HEAD_SHA `
            -TrustedKnowledgeRevision $env:TRUSTED_KNOWLEDGE_REVISION `
            -TestResultsPath source/TestResults `
            -OutputDirectory QaEvidence `
            -ChangedFilesPath QaEvidence/changed-files.txt
          $result = Get-Content QaEvidence/qa-result.json -Raw | ConvertFrom-Json
          "metadata-digest=$($result.metadataDigest)" >> $env:GITHUB_OUTPUT

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ steps.context.outputs.head-sha }}-${{ steps.evidence.outputs.metadata-digest }}
          path: |
            QaEvidence
            source/TestResults
          if-no-files-found: error
          retention-days: 30
