name: QA evidence

on:
  workflow_run:
    workflows: [Hotel code review, PR validation]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: qa-evidence-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  qa:
    name: Independent QA evidence gate
    if: >-
      (github.event.workflow_run.name == 'Hotel code review'
        && github.event.workflow_run.event == 'pull_request_target'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event.workflow_run.name == 'PR validation'
        && github.event.workflow_run.event == 'push'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source context
        id: context
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            let pull;
            let sourceRepository = context.repo.owner + '/' + context.repo.repo;
            let sourceSha = run.head_sha;
            if (run.pull_requests?.length) {
              const triggeringPull = run.pull_requests[0];
              pull = (await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: triggeringPull.number
              })).data;
            } else {
              const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: run.head_sha
              });
              const candidates = pulls.data.filter(candidate =>
                candidate.base.repo.full_name === sourceRepository
                && candidate.base.ref === 'main');
              pull = run.name === 'Hotel code review'
                ? candidates.find(candidate => candidate.head.sha === run.head_sha)
                : candidates
                    .filter(candidate => candidate.merged_at)
                    .sort((left, right) => new Date(right.merged_at) - new Date(left.merged_at))[0];
            }
            if (!pull) {
              core.setFailed('No pull request is associated with the validated commit.');
              return;
            }

            if (run.name === 'Hotel code review') {
              sourceRepository = pull.head.repo?.full_name;
              sourceSha = pull.head.sha;
              if (!sourceRepository
                  || !/^[0-9a-f]{40}$/.test(sourceSha)
                  || sourceSha !== run.head_sha) {
                core.setFailed('The triggering review run does not identify the pull request head.');
                return;
              }
              const currentPull = (await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number
              })).data;
              if (currentPull.head.sha !== sourceSha
                  || currentPull.head.repo?.full_name !== sourceRepository) {
                core.setFailed('The pull request head changed after the reviewed workflow run.');
                return;
              }
              const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
              let validation;
              for (let attempt = 1; attempt <= 60; attempt++) {
                const checks = await github.rest.checks.listForRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sourceSha,
                  per_page: 100
                });
                validation = checks.data.check_runs.find(check =>
                  check.name === 'validate' && check.app?.slug === 'github-actions');
                if (validation?.status === 'completed') {
                  break;
                }
                core.info(`PR validation is not complete (attempt ${attempt}/60).`);
                await sleep(10000);
              }
              if (validation?.conclusion !== 'success') {
                core.setFailed(`PR validation did not succeed for this commit (result: ${validation?.conclusion || 'not found'}).`);
                return;
              }
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100
            });
            const productChange = files.some(file =>
              file.filename.startsWith('src/') || file.filename.startsWith('tests/'));
            core.setOutput('number', pull.number.toString());
            core.setOutput('title', pull.title);
            core.setOutput('product-change', productChange.toString());
            core.setOutput('head-sha', sourceSha);
            core.setOutput('source-repository', sourceRepository);
            core.setOutput('body-base64', Buffer.from(pull.body || '', 'utf8').toString('base64'));

      - name: Check out trusted QA policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.context.outputs.source-repository }}
          ref: ${{ steps.context.outputs.head-sha }}
          path: source
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        working-directory: source
        run: dotnet restore --locked-mode

      - name: Build
        working-directory: source
        run: dotnet build --no-restore

      - name: Run independent QA tests
        working-directory: source
        run: dotnet test --no-build --logger trx --results-directory TestResults

      - name: Build Bicep
        uses: azure/cli@v2
        with:
          inlineScript: az bicep build --file source/infra/main.bicep

      - name: Write pull request evidence
        shell: pwsh
        env:
          BODY_BASE64: ${{ steps.context.outputs.body-base64 }}
        run: |
          New-Item -ItemType Directory -Path QaEvidence -Force | Out-Null
          [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:BODY_BASE64)) |
            Set-Content QaEvidence/pr-body.md

      - name: Evaluate QA evidence
        shell: pwsh
        env:
          PR_NUMBER: ${{ steps.context.outputs.number }}
          PR_TITLE: ${{ steps.context.outputs.title }}
          HEAD_SHA: ${{ steps.context.outputs.head-sha }}
          PRODUCT_CHANGE: ${{ steps.context.outputs.product-change }}
        run: |
          ./trusted/scripts/New-QaEvidence.ps1 `
            -PullRequestNumber $env:PR_NUMBER `
            -PullRequestTitle $env:PR_TITLE `
            -PullRequestBodyPath QaEvidence/pr-body.md `
            -HeadSha $env:HEAD_SHA `
            -TestResultsPath source/TestResults `
            -OutputDirectory QaEvidence `
            -ProductChange $env:PRODUCT_CHANGE

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ steps.context.outputs.head-sha }}
          path: |
            QaEvidence
            source/TestResults
          if-no-files-found: error
          retention-days: 30
