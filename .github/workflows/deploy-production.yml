name: Deploy production

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful Release proposal workflow run ID
        required: true
        type: string
      commit_sha:
        description: Exact 40-character main commit SHA packaged by that run
        required: true
        type: string
      confirmation:
        description: Type DEPLOY-PRODUCTION
        required: true
        type: string
      legacy_sql_secret_cleanup_confirmation:
        description: Type DELETE-ACTIVE-LEGACY-SQL-SECRET
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release evidence
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual authorization and immutable source
        id: verify
        uses: actions/github-script@v8
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          LEGACY_CLEANUP_CONFIRMATION: ${{ inputs.legacy_sql_secret_cleanup_confirmation }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              core.setFailed('Production deployment workflow must run from main.');
              return;
            }
            if (process.env.CONFIRMATION !== 'DEPLOY-PRODUCTION') {
              core.setFailed('Typed confirmation must exactly equal DEPLOY-PRODUCTION.');
              return;
            }
            if (process.env.LEGACY_CLEANUP_CONFIRMATION !== 'DELETE-ACTIVE-LEGACY-SQL-SECRET') {
              core.setFailed('Legacy SQL credential cleanup requires its exact typed confirmation.');
              return;
            }
            if (!/^[0-9]+$/.test(process.env.RELEASE_RUN_ID)) {
              core.setFailed('Release run ID must be numeric.');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(process.env.COMMIT_SHA)) {
              core.setFailed('Commit SHA must be a full lowercase 40-character SHA.');
              return;
            }

            const run = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.RELEASE_RUN_ID)
            })).data;
            if (run.path !== '.github/workflows/release-proposal.yml'
                || run.conclusion !== 'success'
                || run.head_branch !== 'main') {
              core.setFailed('The selected run is not a successful main Release proposal run.');
              return;
            }

            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main'
            });
            const comparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: process.env.COMMIT_SHA,
              head: branch.data.commit.sha
            });
            if (!['identical', 'ahead'].includes(comparison.data.status)) {
              core.setFailed('Selected commit is not contained in main history.');
              return;
            }
            core.setOutput('artifact-name', `release-${process.env.COMMIT_SHA}`);

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Download selected release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.verify.outputs.artifact-name }}
          path: release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}

      - name: Verify artifact checksums and evidence
        shell: pwsh
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          Push-Location release
          try {
            Get-Content checksums.sha256 | ForEach-Object {
              if ($_ -notmatch '^([0-9a-f]{64})  (.+)$') {
                throw "Invalid checksum entry: $_"
              }
              $actual = (Get-FileHash $Matches[2] -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $Matches[1]) {
                throw "Checksum mismatch for $($Matches[2])."
              }
            }
            $evidence = Get-Content release-evidence.json -Raw | ConvertFrom-Json
            if ($evidence.sourceCommit -ne $env:COMMIT_SHA) {
              throw 'Release evidence commit does not match the approved commit.'
            }
            if ([string]$evidence.qaWorkflowRunId -eq '') {
              throw 'Release evidence does not identify the QA workflow run.'
            }
            if ([string]$evidence.qaMetadataDigest -notmatch '^[0-9a-f]{64}$') {
              throw 'Release evidence does not identify the QA metadata digest.'
            }
            if (-not (Test-Path ../scripts/Assert-ProductionDeploymentContract.ps1)) {
              throw 'Release artifact is older than the required production deployment contract.'
            }
            ../scripts/Assert-ProductionDeploymentContract.ps1 -ReleaseDirectory .
          }
          finally {
            Pop-Location
          }

      - name: Verify immutable QA evidence
        uses: actions/github-script@v8
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        with:
          script: |
            const fs = require('fs');
            const evidence = JSON.parse(fs.readFileSync('release/release-evidence.json', 'utf8'));
            const qaRun = (await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(evidence.qaWorkflowRunId)
            })).data;
            if (qaRun.path !== '.github/workflows/qa-evidence.yml'
                || qaRun.conclusion !== 'success') {
              core.setFailed('Release evidence does not reference a successful QA workflow run.');
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(evidence.qaWorkflowRunId),
                per_page: 100
              }
            );
            const qaArtifact = artifacts.find(artifact =>
              artifact.name === `qa-evidence-${process.env.COMMIT_SHA}-${evidence.qaMetadataDigest}`
              && !artifact.expired);
            if (!qaArtifact) {
              core.setFailed('The successful QA run has no unexpired evidence artifact for the selected commit.');
              return;
            }

            const checks = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.COMMIT_SHA,
              per_page: 100
            });
            const validation = checks.data.check_runs.find(check =>
              check.name === 'validate'
              && check.app?.slug === 'github-actions'
              && check.conclusion === 'success');
            if (!validation) {
              core.setFailed('PR validation evidence is not successful for the selected commit.');
            }

      - name: Preserve verified release
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ github.run_id }}
          path: release
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Promote verified artifact
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Download verified release
        uses: actions/download-artifact@v4
        with:
          name: verified-release-${{ github.run_id }}
          path: release

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Classify SQL cutover state before infrastructure mutation
        id: sql-state
        shell: pwsh
        env:
          AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
        run: |
          $serversJson = az sql server list `
            --resource-group agentic-hotelbookingprod `
            --query '[].{name:name}' `
            --output json `
            --only-show-errors
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($serversJson)) {
            throw 'Unable to classify the production SQL state before infrastructure mutation.'
          }
          $servers = @($serversJson | ConvertFrom-Json)
          if ($servers.Count -gt 1) {
            throw 'The production resource group contains multiple SQL servers; cutover is blocked before mutation.'
          }
          if ($servers.Count -eq 0) {
            'configureSql=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'sqlServerName=' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'existingSql=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'preExistingSqlAuthMode=initial' |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $administratorsJson = az sql server ad-admin list `
            --resource-group agentic-hotelbookingprod `
            --server-name $servers[0].name `
            --output json `
            --only-show-errors
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($administratorsJson)) {
            throw 'Unable to verify the existing production SQL Entra administrator before mutation.'
          }
          $administrators = @($administratorsJson | ConvertFrom-Json)
          if (@($administrators | Where-Object {
                $_.sid -eq $env:AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID
              }).Count -ne 1) {
            throw 'Existing production SQL requires the GitHub deployment principal as Entra administrator before any deployment mutation.'
          }
          $sqlAuthMode = ./scripts/Get-AzureSqlAuthenticationMode.ps1 `
            -ResourceGroup agentic-hotelbookingprod `
            -ServerName $servers[0].name
          'configureSql=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          'existingSql=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "preExistingSqlAuthMode=$sqlAuthMode" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sqlServerName=$($servers[0].name)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Deploy production infrastructure
        id: infrastructure
        shell: pwsh
        env:
          AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          AZURE_SQL_ENTRA_ADMIN_NAME: ${{ vars.AZURE_SQL_ENTRA_ADMIN_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          OPERATIONS_API_AUDIENCE: ${{ vars.OPERATIONS_API_AUDIENCE }}
          RESOURCE_GROUP: agentic-hotelbookingprod
        run: |
          $requiredValues = @(
            'AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID',
            'AZURE_SQL_ENTRA_ADMIN_NAME',
            'AZURE_TENANT_ID',
            'OPERATIONS_API_AUDIENCE'
          )
          foreach ($name in $requiredValues) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "The production $name environment variable is required."
            }
          }
          $outputsJson = az deployment group create `
            --name "production-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --resource-group $env:RESOURCE_GROUP `
            --template-file infra/resource-group.bicep `
            --parameters infra/production.parameters.json `
              "operationsApiAudience=$env:OPERATIONS_API_AUDIENCE" `
              "sqlEntraAdminLogin=$env:AZURE_SQL_ENTRA_ADMIN_NAME" `
              "sqlEntraAdminObjectId=$env:AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" `
              "tenantId=$env:AZURE_TENANT_ID" `
              "deploymentPrincipalObjectId=$env:AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" `
              configureApi=false `
              "configureSql=${{ steps.sql-state.outputs.configureSql }}" `
              "existingSqlServerName=${{ steps.sql-state.outputs.sqlServerName }}" `
            --query properties.outputs `
            --output json `
            --only-show-errors
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($outputsJson)) {
            throw 'Production resource-group deployment failed without returning outputs.'
          }
          $outputs = $outputsJson | ConvertFrom-Json
          $requiredOutputs = @(
            'apiAppName',
            'apiName',
            'apiUrl',
            'appServicePlanName',
            'legacyKeyVaultName',
            'searchEndpoint',
            'sqlServerName',
            'staticWebAppName'
          )
          foreach ($name in $requiredOutputs) {
            $value = $outputs.$name.value
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Production deployment output '$name' is missing."
            }
            "$name=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }
          "resourceGroupName=$env:RESOURCE_GROUP" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Ensure API managed identity exists without changing live configuration
        id: api-identity
        shell: pwsh
        run: |
          $appId = az webapp show `
            --resource-group agentic-hotelbookingprod `
            --name '${{ steps.infrastructure.outputs.apiAppName }}' `
            --query id `
            --output tsv `
            --only-show-errors 2>&1
          $appLookupExitCode = $LASTEXITCODE
          $configuredApi = $false
          if ($appLookupExitCode -ne 0 -and $appId -notmatch '(?i)ResourceNotFound|could not be found') {
            throw "Unable to determine whether the production API exists: $appId"
          }
          if ($appLookupExitCode -eq 0 -and -not [string]::IsNullOrWhiteSpace($appId)) {
            $configuredConnection = az webapp config appsettings list `
              --resource-group agentic-hotelbookingprod `
              --name '${{ steps.infrastructure.outputs.apiAppName }}' `
              --query "[?name=='ConnectionStrings__HotelBooking'].value | [0]" `
              --output tsv `
              --only-show-errors
            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to classify whether the existing production API has runtime SQL configuration.'
            }
            $configuredApi = -not [string]::IsNullOrWhiteSpace($configuredConnection)
            $principalId = az webapp identity show `
              --resource-group agentic-hotelbookingprod `
              --name '${{ steps.infrastructure.outputs.apiAppName }}' `
              --query principalId `
              --output tsv `
              --only-show-errors 2>$null
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($principalId)) {
              $principalId = az webapp identity assign `
                --resource-group agentic-hotelbookingprod `
                --name '${{ steps.infrastructure.outputs.apiAppName }}' `
                --query principalId `
                --output tsv `
                --only-show-errors
            }
          }
          else {
            $principalId = az deployment group create `
              --name "production-api-identity-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
              --resource-group agentic-hotelbookingprod `
              --template-file infra/api-identity.bicep `
              --parameters `
                "appServicePlanName=${{ steps.infrastructure.outputs.appServicePlanName }}" `
                "apiAppName=${{ steps.infrastructure.outputs.apiAppName }}" `
                environment=prod `
              --query properties.outputs.apiPrincipalId.value `
              --output tsv `
              --only-show-errors
          }
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($principalId)) {
            throw 'The production API managed identity could not be resolved before SQL bootstrap.'
          }
          "principalId=$($principalId.Trim())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "configuredApi=$($configuredApi.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore deployment tools
        run: |
          dotnet tool restore
          dotnet restore --locked-mode

      - name: Allow deployment runner to reach SQL
        id: sql-firewall
        shell: pwsh
        run: |
          $ip = (Invoke-RestMethod 'https://api.ipify.org').Trim()
          az sql server firewall-rule create `
            --resource-group agentic-hotelbookingprod `
            --server '${{ steps.infrastructure.outputs.sqlServerName }}' `
            --name github-production-runner `
            --start-ip-address $ip `
            --end-ip-address $ip

      - name: Apply database migrations
        env:
          ConnectionStrings__HotelBooking: >-
            Server=tcp:${{ steps.infrastructure.outputs.sqlServerName }}.database.windows.net,1433;
            Initial Catalog=hotelbooking;
            Authentication=Active Directory Default;
            Encrypt=True;
            TrustServerCertificate=False;
        run: >-
          dotnet ef database update
          --project src/Infrastructure/AgenticHotelBooking.Infrastructure.csproj
          --startup-project src/Api/AgenticHotelBooking.Api.csproj
          --connection "$ConnectionStrings__HotelBooking"

      - name: Bootstrap API managed identity database role
        shell: pwsh
        run: |
          $env:AZURE_SQL_ACCESS_TOKEN = az account get-access-token `
            --resource https://database.windows.net/ `
            --query accessToken `
            --output tsv
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($env:AZURE_SQL_ACCESS_TOKEN)) {
            throw 'Unable to acquire an Azure SQL access token.'
          }
          dotnet run `
            --project tools/SqlManagedIdentityBootstrapper/SqlManagedIdentityBootstrapper.csproj `
            --no-restore `
            -- `
            --server '${{ steps.infrastructure.outputs.sqlServerName }}.database.windows.net' `
            --database hotelbooking `
            --principal-name '${{ steps.infrastructure.outputs.apiName }}' `
            --principal-object-id '${{ steps.api-identity.outputs.principalId }}'
      - name: Configure initial API after SQL bootstrap
        if: steps.api-identity.outputs.configuredApi == 'false'
        shell: pwsh
        env:
          AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          AZURE_SQL_ENTRA_ADMIN_NAME: ${{ vars.AZURE_SQL_ENTRA_ADMIN_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          OPERATIONS_API_AUDIENCE: ${{ vars.OPERATIONS_API_AUDIENCE }}
        run: |
          az deployment group create `
            --name "production-initial-api-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --resource-group agentic-hotelbookingprod `
            --template-file infra/resource-group.bicep `
            --parameters infra/production.parameters.json `
              "operationsApiAudience=$env:OPERATIONS_API_AUDIENCE" `
              "sqlEntraAdminLogin=$env:AZURE_SQL_ENTRA_ADMIN_NAME" `
              "sqlEntraAdminObjectId=$env:AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" `
              "tenantId=$env:AZURE_TENANT_ID" `
              "deploymentPrincipalObjectId=$env:AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" `
              configureApi=true `
              configureSql=false `
              "existingSqlServerName=${{ steps.sql-state.outputs.sqlServerName }}" `
            --only-show-errors
          if ($LASTEXITCODE -ne 0) {
            $sqlState = switch ('${{ steps.sql-state.outputs.preExistingSqlAuthMode }}') {
              'legacy' { 'server-side legacy SQL authentication remains enabled' }
              'entraOnly' { 'SQL was already Entra-only and remains Entra-only' }
              'initial' { 'the newly created SQL server remains Entra-only' }
              default { throw 'The pre-existing production SQL authentication mode is invalid.' }
            }
            throw "The initial production API configuration failed after SQL identity bootstrap; $sqlState, and the API may be retried as unconfigured."
          }

      - name: Index canonical knowledge
        shell: pwsh
        run: |
          ./scripts/Invoke-KnowledgeIndexerWithRetry.ps1 `
            -Root docs/knowledge `
            -Endpoint '${{ steps.infrastructure.outputs.searchEndpoint }}' `
            -Revision '${{ inputs.commit_sha }}' `
            -Index knowledge `
            -MaximumWaitSeconds 600

      - name: Deploy API artifact
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infrastructure.outputs.apiAppName }}
          package: release/api.zip

      - name: Verify migration-disabled API artifact before existing-environment cutover
        shell: pwsh
        run: |
          $readinessUri = '${{ steps.infrastructure.outputs.apiUrl }}/api/hotels'
          $lastError = ''
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest `
                -Uri $readinessUri `
                -TimeoutSec 30 `
                -UseBasicParsing
              if ($response.StatusCode -eq 200) {
                exit 0
              }
              $lastError = "HTTP $($response.StatusCode)"
            }
            catch {
              $lastError = $_.Exception.Message
            }
            if ($attempt -lt 12) {
              Start-Sleep -Seconds 10
            }
          }
          throw "The migration-disabled production API artifact was not ready before managed-identity configuration: $lastError"

      - name: Refresh Azure login immediately before managed-identity API cutover
        if: steps.api-identity.outputs.configuredApi == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply managed-identity API configuration
        id: api-cutover
        if: steps.api-identity.outputs.configuredApi == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          AZURE_SQL_ENTRA_ADMIN_NAME: ${{ vars.AZURE_SQL_ENTRA_ADMIN_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          OPERATIONS_API_AUDIENCE: ${{ vars.OPERATIONS_API_AUDIENCE }}
        run: |
          $previousConnection = az webapp config appsettings list `
            --resource-group agentic-hotelbookingprod `
            --name '${{ steps.infrastructure.outputs.apiAppName }}' `
            --query "[?name=='ConnectionStrings__HotelBooking'].value | [0]" `
            --output tsv `
            --only-show-errors
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($previousConnection)) {
            throw 'The configured production API SQL connection could not be captured before cutover.'
          }
          Set-Content `
            -Path (Join-Path $env:RUNNER_TEMP 'production-previous-sql-connection.txt') `
            -Value $previousConnection `
            -NoNewline
          ./scripts/Protect-DeploymentSecretFile.ps1 `
            -Path (Join-Path $env:RUNNER_TEMP 'production-previous-sql-connection.txt')
          try {
            az deployment group create `
              --name "production-api-cutover-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
              --resource-group agentic-hotelbookingprod `
              --template-file infra/resource-group.bicep `
              --parameters infra/production.parameters.json `
                "operationsApiAudience=$env:OPERATIONS_API_AUDIENCE" `
                "sqlEntraAdminLogin=$env:AZURE_SQL_ENTRA_ADMIN_NAME" `
                "sqlEntraAdminObjectId=$env:AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" `
                "tenantId=$env:AZURE_TENANT_ID" `
                "deploymentPrincipalObjectId=$env:AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" `
                configureApi=true `
                configureSql=false `
                "existingSqlServerName=${{ steps.sql-state.outputs.sqlServerName }}" `
              --only-show-errors
            if ($LASTEXITCODE -ne 0) {
              throw 'The managed-identity API configuration deployment failed or returned an ambiguous result.'
            }
          }
          catch {
            Set-Content `
              -Path (Join-Path $env:RUNNER_TEMP 'production-api-cutover-error.txt') `
              -Value $_.Exception.Message `
              -NoNewline
            throw
          }

      - name: Prove managed-identity SQL-backed API readiness
        id: api-cutover-readiness
        if: steps.api-cutover.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $lastError = ''
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $healthResponse = Invoke-WebRequest `
                -Uri '${{ steps.infrastructure.outputs.apiUrl }}/health' `
                -TimeoutSec 15 `
                -UseBasicParsing
              $catalogResponse = Invoke-WebRequest `
                -Uri '${{ steps.infrastructure.outputs.apiUrl }}/api/hotels' `
                -TimeoutSec 30 `
                -UseBasicParsing
              if ($healthResponse.StatusCode -eq 200 -and $catalogResponse.StatusCode -eq 200) {
                exit 0
              }
              $lastError = "Health HTTP $($healthResponse.StatusCode); catalog HTTP $($catalogResponse.StatusCode)"
            }
            catch {
              $lastError = $_.Exception.Message
            }
            if ($attempt -lt 12) {
              Start-Sleep -Seconds 10
            }
          }
          Set-Content `
            -Path (Join-Path $env:RUNNER_TEMP 'production-api-cutover-error.txt') `
            -Value "The managed-identity SQL-backed readiness proof failed: $lastError" `
            -NoNewline
          throw "The managed-identity SQL-backed readiness proof failed: $lastError"

      - name: Refresh Azure login for managed-identity API rollback
        id: api-rollback-login
        if: >-
          always() &&
          steps.api-identity.outputs.configuredApi == 'true' &&
          (steps.api-cutover.outcome == 'failure' ||
          steps.api-cutover-readiness.outcome == 'failure')
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore and prove prior API SQL configuration
        if: >-
          always() &&
          steps.api-rollback-login.outcome == 'success' &&
          (steps.api-cutover.outcome == 'failure' ||
          steps.api-cutover-readiness.outcome == 'failure')
        shell: pwsh
        run: |
          $previousConnectionPath = Join-Path $env:RUNNER_TEMP 'production-previous-sql-connection.txt'
          $cutoverErrorPath = Join-Path $env:RUNNER_TEMP 'production-api-cutover-error.txt'
          if (-not (Test-Path $previousConnectionPath)) {
            throw 'Production API cutover failed before the prior SQL connection was captured. SQL-only enforcement and cleanup remain blocked.'
          }
          $previousConnection = Get-Content $previousConnectionPath -Raw
          $cutoverError = if (Test-Path $cutoverErrorPath) {
            Get-Content $cutoverErrorPath -Raw
          }
          else {
            'The managed-identity API cutover failed without a captured diagnostic.'
          }
          az webapp config appsettings set `
            --resource-group agentic-hotelbookingprod `
            --name '${{ steps.infrastructure.outputs.apiAppName }}' `
            --settings "ConnectionStrings__HotelBooking=$previousConnection" `
            --output none `
            --only-show-errors
          if ($LASTEXITCODE -ne 0) {
            throw "Production API cutover failed and the prior SQL connection could not be restored. SQL-only enforcement and cleanup remain blocked. Original failure: $cutoverError"
          }
          $rollbackReady = $false
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest `
                -Uri '${{ steps.infrastructure.outputs.apiUrl }}/api/hotels' `
                -TimeoutSec 30 `
                -UseBasicParsing
              if ($response.StatusCode -eq 200) {
                $rollbackReady = $true
                break
              }
            }
            catch {
              if ($attempt -eq 12) {
                $rollbackError = $_.Exception.Message
              }
            }
            if ($attempt -lt 12) {
              Start-Sleep -Seconds 10
            }
          }
          if (-not $rollbackReady) {
            throw "Production API cutover failed; the prior SQL setting was restored but runtime rollback could not be proven. SQL-only enforcement and cleanup remain blocked. Rollback error: $rollbackError. Original failure: $cutoverError"
          }
          $sqlState = switch ('${{ steps.sql-state.outputs.preExistingSqlAuthMode }}') {
            'legacy' { 'server-side legacy SQL authentication remains enabled' }
            'entraOnly' { 'SQL was already Entra-only and remains Entra-only' }
            default { 'the SQL authentication state remains unchanged' }
          }
          throw "Production API cutover failed; the prior app SQL connection was restored and proven ready, and $sqlState. SQL-only enforcement and cleanup remain blocked. Original failure: $cutoverError"

      - name: Remove captured prior API SQL configuration
        if: always() && steps.api-identity.outputs.configuredApi == 'true'
        shell: pwsh
        run: |
          ./scripts/Remove-DeploymentSecretFiles.ps1 -Path @(
            (Join-Path $env:RUNNER_TEMP 'production-previous-sql-connection.txt'),
            (Join-Path $env:RUNNER_TEMP 'production-api-cutover-error.txt')
          )

      - name: Enforce SQL Entra-only after managed-identity API readiness
        shell: pwsh
        env:
          AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID: ${{ vars.AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID }}
          AZURE_SQL_ENTRA_ADMIN_NAME: ${{ vars.AZURE_SQL_ENTRA_ADMIN_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          OPERATIONS_API_AUDIENCE: ${{ vars.OPERATIONS_API_AUDIENCE }}
        run: |
          az deployment group create `
            --name "production-sql-entra-only-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" `
            --resource-group agentic-hotelbookingprod `
            --template-file infra/resource-group.bicep `
            --parameters infra/production.parameters.json `
              "operationsApiAudience=$env:OPERATIONS_API_AUDIENCE" `
              "sqlEntraAdminLogin=$env:AZURE_SQL_ENTRA_ADMIN_NAME" `
              "sqlEntraAdminObjectId=$env:AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" `
              "tenantId=$env:AZURE_TENANT_ID" `
              "deploymentPrincipalObjectId=$env:AZURE_DEPLOYMENT_PRINCIPAL_OBJECT_ID" `
              configureApi=false `
              configureSql=true `
              "existingSqlServerName=${{ steps.sql-state.outputs.sqlServerName }}" `
            --only-show-errors
          if ($LASTEXITCODE -ne 0) {
            throw 'SQL Entra-only enforcement failed after the API proved managed-identity readiness; legacy credential cleanup remains blocked.'
          }

      - name: Verify API after SQL Entra-only enforcement
        shell: pwsh
        run: |
          $lastError = ''
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              $catalogResponse = Invoke-WebRequest `
                -Uri '${{ steps.infrastructure.outputs.apiUrl }}/api/hotels' `
                -TimeoutSec 30 `
                -UseBasicParsing
              if ($catalogResponse.StatusCode -eq 200) {
                exit 0
              }
              $lastError = "Catalog HTTP $($catalogResponse.StatusCode)"
            }
            catch {
              $lastError = $_.Exception.Message
            }
            if ($attempt -lt 6) {
              Start-Sleep -Seconds 10
            }
          }
          throw "The API failed after SQL Entra-only enforcement: $lastError"

      - name: Remove approved active legacy SQL administrator credential
        shell: pwsh
        run: |
          ./scripts/Remove-LegacySqlCredential.ps1 `
            -ResourceGroup '${{ steps.infrastructure.outputs.resourceGroupName }}' `
            -SqlServerName '${{ steps.infrastructure.outputs.sqlServerName }}' `
            -ApiAppName '${{ steps.infrastructure.outputs.apiAppName }}' `
            -LegacyVaultName '${{ steps.infrastructure.outputs.legacyKeyVaultName }}' `
            -Approved `
            -RuntimeReadinessVerified

      - name: Obtain Static Web Apps deployment token
        id: static-web-token
        shell: pwsh
        env:
          RESOURCE_GROUP: ${{ steps.infrastructure.outputs.resourceGroupName }}
          STATIC_WEB_APP: ${{ steps.infrastructure.outputs.staticWebAppName }}
        run: |
          $token = az staticwebapp secrets list `
            --name $env:STATIC_WEB_APP `
            --resource-group $env:RESOURCE_GROUP `
            --query properties.apiKey `
            --output tsv `
            --only-show-errors
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($token)) {
            throw 'Azure did not return a Static Web Apps deployment token.'
          }
          $token = $token.Trim()
          Write-Output "::add-mask::$token"
          "token=$token" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare web artifact
        shell: pwsh
        run: |
          Expand-Archive release/web.zip deployed-web
          ./scripts/Set-WebApiConfiguration.ps1 `
            -WebRoot deployed-web/wwwroot `
            -ApiBaseUrl '${{ steps.infrastructure.outputs.apiUrl }}'

      - name: Deploy web artifact
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.static-web-token.outputs.token }}
          action: upload
          app_location: deployed-web/wwwroot
          output_location: ''
          skip_app_build: true

      - name: Refresh Azure login for deployment runner SQL firewall cleanup
        id: sql-firewall-cleanup-login
        if: always() && steps.sql-firewall.outcome == 'success'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Remove deployment runner SQL firewall rule
        if: >-
          always() &&
          steps.sql-firewall.outcome == 'success' &&
          steps.sql-firewall-cleanup-login.outcome == 'success'
        run: >-
          az sql server firewall-rule delete
          --resource-group agentic-hotelbookingprod
          --server '${{ steps.infrastructure.outputs.sqlServerName }}'
          --name github-production-runner
